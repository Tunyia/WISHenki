# Вишенки — БД + API + сайт одной командой
# Запуск из корня репозитория: docker compose up --build

services:
  db:
    image: postgres:16-alpine
    container_name: wishenki_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vish_rating
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vish_rating"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 5s

  api:
    build:
      context: ./backend/project_vuz
      dockerfile: Dockerfile
    container_name: wishenki_api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/vish_rating
      PHOTOS_DIR: /photos
    volumes:
      - ./photos:/photos:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: wishenki_web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
