services:
  db:
    image: postgres:16-alpine
    container_name: vish_rating_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vish_rating
    ports:
      # 5433 на хосте, чтобы не конфликтовать с локальным PostgreSQL на :5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vish_rating"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
